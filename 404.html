<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found · Moh Kashani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <!-- Root-relative: GitHub Pages serves this file at whatever missing URL was requested -->
  <link rel="stylesheet" href="/style.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem 1rem;
      text-align: center;
    }
    .not-found .code {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--accent);
    }
    .not-found h1 {
      font-family: var(--font-head);
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.1;
    }
    .not-found p { color: var(--muted); max-width: 32rem; }
    .not-found .btn-primary {
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <span class="code">404</span>
    <h1>This road doesn't lead anywhere.</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/" class="btn-primary">Back to mkashani.com</a>
  </main>
</body>
</html>
